name: Apply usage-device migration (one-shot)

# One-shot, owner-approved (2026-09-17, in-chat): applies
# supabase-usage-device-migration.sql to the PIANO APP's Supabase project
# (gsaqgbracxnucdmtmcxz — NOT the BOS project; that one has bos-deploy.yml).
#
# Uses the Supabase Management API SQL endpoint with the repo's existing
# SUPABASE_ACCESS_TOKEN secret (same secret bos-deploy.yml already uses).
# The migration is additive + re-runnable (add column if not exists /
# create or replace function), so a duplicate run is harmless.
#
# This workflow SELF-DISABLES after one run by aborting on a concurrency
# guard — to run it again for a future migration, re-enable it or replace
# this file.

on:
  workflow_dispatch: {}   # manual trigger only
  # Auto-run once on the push that adds this file (run_id guard makes the
  # second run of THIS file a no-op):
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-usage-device-migration.yml"

# Never run twice concurrently.
concurrency:
  group: apply-usage-device-migration
  cancel-in-progress: false

jobs:
  apply:
    name: Apply supabase-usage-device-migration.sql
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply migration via Supabase Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: gsaqgbracxnucdmtmcxz
        run: |
          set -euo pipefail
          SQL="$(cat supabase-usage-device-migration.sql)"
          HTTP=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(jq -Rs '{query: .}' <<< "$SQL")")
          echo "HTTP ${HTTP}"
          cat /tmp/resp.json || true
          if [ "$HTTP" -lt 200 ] || [ "$HTTP" -ge 300 ]; then
            echo "::error::Migration apply failed (HTTP ${HTTP})"
            exit 1
          fi

      - name: Verify — columns and functions exist
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: gsaqgbracxnucdmtmcxz
        run: |
          set -euo pipefail
          Q="select column_name from information_schema.columns where table_schema='public' and table_name='usage_events' and column_name in ('dev','dev_w') order by column_name;"
          HTTP=$(curl -sS -o /tmp/cols.json -w "%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(jq -Rs '{query: .}' <<< "$Q")")
          echo "columns:"; cat /tmp/cols.json; echo
          N=$(jq 'length' /tmp/cols.json)
          if [ "$N" -ne 2 ]; then echo "::error::Expected 2 new columns, found $N"; exit 1; fi
          Q2="select routine_name from information_schema.routines where routine_schema='public' and routine_name in ('admin_device_mix','admin_device_widths') order by routine_name;"
          HTTP2=$(curl -sS -o /tmp/fns.json -w "%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(jq -Rs '{query: .}' <<< "$Q2")")
          echo "functions:"; cat /tmp/fns.json; echo
          N2=$(jq 'length' /tmp/fns.json)
          if [ "$N2" -ne 2 ]; then echo "::error::Expected 2 RPCs, found $N2"; exit 1; fi
          echo "::notice::Migration verified: columns dev/dev_w + admin_device_mix/admin_device_widths present"
