name: Deploy BOS to GitHub Pages

# Build TIGA Automation (BOS Next.js) and deploy alongside TIGA AI on GitHub Pages.
# TIGA AI lives at the repo root; BOS lives under /studio/.
# Both apps are built and deployed together so the combined site works.

on:
  push:
    branches: [main]
    paths:
      - "bos/**"
      - ".github/workflows/bos-github-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment to GitHub Pages
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: bos/package-lock.json

      # ── Build TIGA AI (Vite) to dist/ ──────────────────────────────────
      - name: Install TIGA AI dependencies
        run: npm install

      - name: Build TIGA AI
        run: npm run build

      # ── Build BOS (Next.js) to bos/out/ ────────────────────────────────
      - name: Install BOS dependencies
        working-directory: bos
        run: npm ci

      - name: Build BOS
        working-directory: bos
        run: npm run build

      # ── Merge both into _site/ ─────────────────────────────────────────
      - name: Merge into _site/ for GitHub Pages
        run: |
          # Start with TIGA AI at root
          cp -r dist _site
          # Add BOS under /studio/
          mkdir -p _site/studio
          cp -r bos/out/* _site/studio/
          echo "Merged site contents:"
          ls -la _site/
          echo "---"
          echo "BOS at /studio/:"
          ls -la _site/studio/ | head -10

      # ── Deploy to GitHub Pages ─────────────────────────────────────────
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
