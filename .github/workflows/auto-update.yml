name: Auto-release (OTA)

# ทุก push ที่แตะโค้ดแอพบน main → bump เวอร์ชัน + build + publish OTA อัตโนมัติ
# แอพมือถือ (ผ่าน native-updater.ts) จะดาวน์โหลดอัปเดตเองตอนเปิดครั้งถัดไป —
# ไม่ต้องทำ release ด้วยมืออีก. ถ้า push นั้นแตะ native code (android/**) จะ
# flag apkVersion + push main → claude/upbeat-fermi-dey70w ให้ android-debug-build
# สร้าง APK ใหม่ และแอพจะแจ้ง "อัปเดตแอป" ในแอพ (แตะติดตั้งครั้งเดียว).
# Commit ที่เริ่มด้วย "Auto-release" (ผลงานของ workflow เอง) จะถูกข้าม — ป้องกัน loop.

on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!studio/**"
      - "!updates/**"
      - "!version.json"
      - "!*.md"
      - "!AGENTS.md"
      - "!MOBILE_BUILD.md"

permissions:
  contents: write

jobs:
  auto-release:
    if: ${{ !startsWith(github.event.head_commit.message, 'Auto-release') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # HEAD~1 ใช้ diff ว่า push นี้แตะ native code หรือไม่

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Detect native-code change in this push
        id: native
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -qE '^(android/|ios/|capacitor.config.ts)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: npm install
        run: npm install

      - name: Bump version, build, publish OTA
        run: node scripts/auto-release.mjs "${{ steps.native.outputs.changed }}"

      - name: Commit + push the release
        run: |
          git config user.name "TiGA Auto Release"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          NEW_VER="$(node -p "require('./package.json').version")"
          git commit -m "Auto-release v${NEW_VER} (OTA)"
          git push origin main
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Rebuild APK when native code changed
        # Best-effort only: android-debug-build.yml now also triggers directly on
        # main pushes, so the APK is rebuilt from main either way. This mirror
        # push is just the old fallback — the dev branch may have diverged, in
        # which case the push is rejected and that is fine (|| true).
        if: steps.native.outputs.changed == 'true'
        run: git push origin main:claude/upbeat-fermi-dey70w || true
        env:
          GH_TOKEN: ${{ github.token }}

  # ═══════════════════════════════════════════════════════════════════════
  # BOS (TIGA Automation) — separate job, deploys to GitHub Pages /studio/
  # ═══════════════════════════════════════════════════════════════════════
  deploy-bos:
    # Must run AFTER auto-release, not beside it: auto-release commits the
    # version bump and pushes main mid-job, which fires a legacy Pages build;
    # deploy-pages then waits on a Pages deployment that is already contended
    # and times out ("Timeout reached, aborting"), failing the whole deploy.
    # Serializing keeps the Pages state consistent and the deploy reliable.
    needs: auto-release
    if: ${{ !startsWith(github.event.head_commit.message, 'Auto-release') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # ── TIGA AI (Vite) — root of GitHub Pages ──────────────────────────
      - name: "[TIGA AI] Install dependencies"
        run: npm install

      - name: "[TIGA AI] Build"
        run: npm run build

      # ── BOS (Next.js) — /studio/ on GitHub Pages ──────────────────────
      - name: "[BOS] Install dependencies"
        working-directory: bos
        run: npm ci

      - name: "[BOS] Build"
        working-directory: bos
        run: npm run build

      # ── Merge both apps into _site/ ───────────────────────────────────
      # version.json + updates/ live at repo root (never inside dist/), but the
      # app fetches both from the site root at runtime: version.json drives the
      # in-app APK install/update banner and updates/manifest.json is the native
      # Android OTA feed (native-updater.ts). Without copying them here every
      # deploy 404s those paths — silently disabling OTA and the APK banner for
      # everyone, even though npm run build and the OTA zip publishing all ran.
      - name: "Merge: TIGA AI at root + BOS at /studio/"
        run: |
          cp -r dist _site
          mkdir -p _site/studio
          cp -r bos/out/* _site/studio/
          cp version.json _site/version.json
          mkdir -p _site/updates
          cp updates/manifest.json _site/updates/manifest.json
          cp updates/dist-*.zip _site/updates/
          # ── everything below is a file that lives at the REPO ROOT and is
          # therefore NOT inside dist/ ──
          # The published site is this _site directory, never the repo tree, so
          # anything not copied here 404s no matter how correctly it was built
          # and committed. That is not hypothetical: /privacy-policy.html is
          # linked from the PDPA consent checkbox on the sign-up screen and has
          # been returning 404 for every user, and marketing landing page 1 was
          # committed, deployed and completely unreachable for the same reason.
          cp privacy-policy.html _site/privacy-policy.html
          # Marketing landing page 1 ships as three URLs, one per market. The
          # en/zh variants reference ../landing/bundle/, so there is exactly
          # one copy of the code behind all three.
          mkdir -p _site/landing _site/landing-en _site/landing-zh
          cp landing/index.html    _site/landing/index.html
          cp landing-en/index.html _site/landing-en/index.html
          cp landing-zh/index.html _site/landing-zh/index.html
          cp -r landing/bundle     _site/landing/bundle
          cp landing.html landing-en.html landing-zh.html _site/
          # Fail the deploy loudly rather than shipping a site with a dead
          # marketing URL on it — silence is exactly how this went unnoticed
          # the first time, when the whole page 404'd for hours.
          for f in privacy-policy.html landing.html landing-en.html landing-zh.html \
                   landing/index.html landing-en/index.html landing-zh/index.html; do
            test -s "_site/$f" || { echo "MISSING: _site/$f"; exit 1; }
          done
          test -d _site/landing/bundle || { echo "MISSING: _site/landing/bundle"; exit 1; }
          # ...and that each variant really is in its own language, not three
          # copies of the Thai one.
          grep -q '<html lang="th">' _site/landing/index.html    || { echo "landing/ is not Thai"; exit 1; }
          grep -q '<html lang="en">' _site/landing-en/index.html || { echo "landing-en/ is not English"; exit 1; }
          grep -q '<html lang="zh">' _site/landing-zh/index.html || { echo "landing-zh/ is not Chinese"; exit 1; }
          echo "published: 3 landing URLs + their root-level mirrors"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
