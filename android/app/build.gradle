apply plugin: 'com.android.application'

// The APK version always mirrors the web/OTA release version (package.json) —
// versionName feeds the in-app "new APK available" prompt (App.tsx compares it
// against version.json's apkVersion), and versionCode must strictly increase
// for Play Store / over-the-top installs to accept an update.
def appVersion = new groovy.json.JsonSlurper().parseText(file("../../package.json").text).version

/* versionCode: it COUNTS FROM 1 and can only go up.
   (owner, 2026-11-17: "change the formula before the first upload, start again from 1")

   Nothing has been uploaded to Play yet, so the numbering can be reset, and it had to be:
     • 1st scheme, major*10000 + minor*100 + patch, broke at patch 100 (13.7.526 -> 131226, 13.8.0 -> 130800);
     • 2nd scheme, major*1_000_000 + minor*1_000 + patch, broke at patch 1000: the patch is already past 999
       (13.7.1101 -> 13,008,101) and 13.8.0 would have been 13,008,000, LOWER, which Play rejects with
       "version code already exists / must be greater" on the one upload that matters.

   The code is the distance from a base version, each part with its own room:

       versionCode = (major - 13) * 10_000_000 + (minor - 7) * 100_000 + (patch - 1099)

   BASE is 13.7.1099 = code 0 (never shipped as an app bundle). 13.7.1100 = 1, 13.7.1101 = 2, ...
     patch  up to 99,999   (the OTA bot ships a few times a day: decades of room, and a minor bump resets it to 0)
     minor  up to 99       (13.8.0 is always ABOVE 13.7.99999, because 100,000 > 99,999)
     major  up to 223      (Play's ceiling is 2,100,000,000)
   The build STOPS (it never wraps silently) when a part is out of range or the version is not newer than BASE.
   scripts/smoke-android-play-store.mjs (npm run verify:android) re-implements this and pins every step.

   AFTER THE FIRST PLAY UPLOAD NEVER CHANGE THE BASE OR THE FORMULA: a lower code is refused for ever. */
def BASE_MAJOR = 13
def BASE_MINOR = 7
def BASE_PATCH = 1099
def vmaj = appVersion.tokenize(".")[0] as int
def vmin = appVersion.tokenize(".")[1] as int
def vpat = appVersion.tokenize(".")[2] as int
if (vmin > 99 || vpat > 99999) {
    throw new GradleException("versionCode: version ${appVersion} is outside the numbering (minor <= 99, patch <= 99999); see the comment in android/app/build.gradle")
}
def versionCodeLong = (vmaj - BASE_MAJOR) * 10000000L + (vmin - BASE_MINOR) * 100000L + (vpat - BASE_PATCH)
if (versionCodeLong < 1L || versionCodeLong > 2100000000L) {
    throw new GradleException("versionCode ${versionCodeLong} for version ${appVersion} is outside 1..2,100,000,000 (it counts from ${BASE_MAJOR}.${BASE_MINOR}.${BASE_PATCH}); see the comment in android/app/build.gradle")
}
def versionCodeValue = versionCodeLong as int

android {
    namespace = "com.tigaalpha.tigaai"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.tigaalpha.tigaai"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode versionCodeValue
        versionName appVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        debug {
            // Committed on purpose: this is a debug-only key (default Android
            // debug alias/passwords, never accepted by Play Store), pinned so
            // every CI run signs with the SAME key. Without this, Gradle's
            // implicit default auto-generates a fresh random debug keystore
            // per machine, and CI runners are ephemeral (a new one every run)
            // -> every rebuilt APK had a different signature -> installing a
            // newer debug build over an older one failed with a signature
            // mismatch (Android/OEM installers surface this as a generic
            // "App not installed").
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            // Production key — loaded from android/keystore.properties, which is
            // gitignored (see keystore.properties.example + PLAY_STORE_GUIDE.md).
            // When that file is absent (CI, fresh clones) this config stays
            // empty and release builds are unsigned — debug builds are
            // unaffected, so the auto-built debug APK keeps working everywhere.
            def ksp = rootProject.file('keystore.properties')
            if (ksp.exists()) {
                def props = new Properties()
                ksp.withInputStream { props.load(it) }
                storeFile file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
