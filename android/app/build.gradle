apply plugin: 'com.android.application'

// The APK version always mirrors the web/OTA release version (package.json) —
// versionName feeds the in-app "new APK available" prompt (App.tsx compares it
// against version.json's apkVersion), and versionCode must strictly increase
// for Play Store / over-the-top installs to accept an update.
def appVersion = new groovy.json.JsonSlurper().parseText(file("../../package.json").text).version

/* versionCode, in a form that CANNOT go backwards.

   It used to be major*10000 + minor*100 + patch, which quietly assumes the
   patch number stays under 100. It is not: the OTA bot ships roughly hourly, so
   the patch is already in the hundreds (13.7.526), and at that point the
   formula overflows into the minor's slot AND, worse, the next minor release
   produces a SMALLER number than the patch it follows:

       13.7.526 -> 131226        (minor 7, patch 526, overflowed to "12.26")
       13.8.0   -> 130800        LOWER — Play rejects the update outright

   That is not a cosmetic risk. It is the "this version has already been
   uploaded" error on the one upload that matters, and it would surface only
   after the store listing is live.

   Each component now gets its own digit budget wide enough for the numbers this
   project actually produces — patch in the thousands, minor in the hundreds —
   so a bump in any one component always raises the total:

       major * 1_000_000 + minor * 1_000 + patch

   Verified against the real sequence (scripts/smoke-android-play-store.mjs pins
   it): 13.7.526 -> 13,007,526, and every realistic next step — 13.7.527,
   13.8.0, 13.10.0, 14.0.0 — increases.

   The one thing this cannot express is a patch of 1000+ ALONGSIDE a higher
   minor: 13.7.1000 and 13.8.0 both land near 13,008,000. No positional
   encoding can, and it is not a near-term problem: the patch only climbs when
   the OTA bot ships, roughly hourly, so reaching 1000 is about six weeks of
   unbroken releases. The test pins that boundary explicitly rather than
   leaving it to be discovered as a rejected upload.

   Play's ceiling is 2,100,000,000, which this reaches only at major 2100. */
def vmaj = appVersion.tokenize(".")[0] as int
def vmin = appVersion.tokenize(".")[1] as int
def vpat = appVersion.tokenize(".")[2] as int
def versionCodeValue = vmaj * 1000000 + vmin * 1000 + vpat

android {
    namespace = "com.tigaalpha.tigaai"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.tigaalpha.tigaai"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode versionCodeValue
        versionName appVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        debug {
            // Committed on purpose: this is a debug-only key (default Android
            // debug alias/passwords, never accepted by Play Store), pinned so
            // every CI run signs with the SAME key. Without this, Gradle's
            // implicit default auto-generates a fresh random debug keystore
            // per machine, and CI runners are ephemeral (a new one every run)
            // -> every rebuilt APK had a different signature -> installing a
            // newer debug build over an older one failed with a signature
            // mismatch (Android/OEM installers surface this as a generic
            // "App not installed").
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            // Production key — loaded from android/keystore.properties, which is
            // gitignored (see keystore.properties.example + PLAY_STORE_GUIDE.md).
            // When that file is absent (CI, fresh clones) this config stays
            // empty and release builds are unsigned — debug builds are
            // unaffected, so the auto-built debug APK keeps working everywhere.
            def ksp = rootProject.file('keystore.properties')
            if (ksp.exists()) {
                def props = new Properties()
                ksp.withInputStream { props.load(it) }
                storeFile file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
