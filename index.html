<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#faf9f5" />
    <!-- Declares the scheme for the boot screen below, which paints before any
         stylesheet loads. An in-app browser (Messenger, LINE) running in dark
         mode will otherwise algorithmically darken it. The app's own CSS sets
         color-scheme per theme afterwards and overrides this. -->
    <meta name="color-scheme" content="light" />
    <meta name="description" content="TiGA AI — AI-powered piano teacher with interactive keyboard, scales, chords and a learning pathway." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TiGA Piano" />
    <title>TiGA AI</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https://*.supabase.co https://fonts.googleapis.com https://fonts.gstatic.com https://cdn.jsdelivr.net https://storage.googleapis.com; img-src 'self' data: blob: https:; media-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.stripe.com https://cdn.jsdelivr.net https://storage.googleapis.com; worker-src 'self' blob:; frame-src https://js.stripe.com https://hooks.stripe.com https://drive.google.com https://www.youtube-nocookie.com;" />
    <style>
      html, body, #root { height: 100%; margin: 0; background: #faf9f5; }

      /* ── First paint ──
         The whole app is one inlined module script. It is deferred, so the
         browser is free to paint the body first — but the body was a single
         empty <div id="root">, so there was nothing to paint and the screen
         stayed blank until megabytes of JavaScript had parsed and React had
         mounted. Measured cold on a throttled mid-range Android: 2.1s on good
         4G, 5.3s on slow 4G, of white.

         These few hundred bytes are the fix. They are plain markup with no
         script behind them, so they appear in the first frame, and main.tsx
         fades them out once React has actually rendered. Nothing here is
         interactive on purpose: showing a piano that cannot be played yet
         would be a worse lie than showing that we are getting ready. */
      #boot {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 22px; background: #faf9f5; color: #1a1a1a;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        transition: opacity .28s ease;
      }
      #boot.gone { opacity: 0; pointer-events: none; }
      #boot .mark {
        font-size: 40px; font-weight: 700; letter-spacing: .22em;
        padding-left: .22em; /* balance the trailing letter-space */
      }
      #boot .say { font-size: 14px; opacity: .62; letter-spacing: .01em; }
      #boot .bar {
        width: 152px; height: 3px; border-radius: 3px; overflow: hidden;
        background: rgba(26,26,26,.1);
      }
      #boot .bar i {
        display: block; height: 100%; width: 40%; border-radius: 3px;
        background: #1a1a1a; animation: bootslide 1.15s ease-in-out infinite;
      }
      @keyframes bootslide {
        0%   { transform: translateX(-105%) }
        100% { transform: translateX(305%) }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .bar i { animation: none; width: 100%; opacity: .35 }
      }
      @media (prefers-color-scheme: dark) {
        html, body, #root, #boot { background: #14110f; }
        #boot { color: #f5f0ed; }
        #boot .bar { background: rgba(245,240,237,.14); }
        #boot .bar i { background: #f5f0ed; }
      }
    </style>
    <script type="module" crossorigin src="./bundle/index.template-CcCXXCnl.js"></script>
  </head>
  <body>
    <div id="boot">
      <div class="mark">TIGA</div>
      <div class="bar"><i></i></div>
      <div class="say">กำลังเตรียมเปียโนให้คุณ</div>
    </div>
    <div id="root"></div>

    <!-- The app goes LAST, on purpose. vite-plugin-singlefile inlines this tag
         in place, so wherever it sits, megabytes of module source sit too, and
         the HTML parser has to read every byte of that text before it reaches
         whatever follows. While the tag lived in <head> the boot screen below
         <body> could not be reached, let alone painted, until the whole bundle
         had been parsed: first paint measured 2.4s on good 4G and 4.9s on slow
         4G, which is to say the boot screen was arriving too late to be a boot
         screen. Parsed last, the markup above paints first. -->
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          // Unregister any stale SW registrations on a different script URL, then register fresh.
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            var kept = null;
            var kills = [];
            regs.forEach(function (r) {
              if (r.active && r.active.scriptURL && r.active.scriptURL.indexOf("sw.js") !== -1) {
                kept = r;
              } else {
                kills.push(r.unregister());
              }
            });
            return Promise.all(kills);
          }).then(function () {
            return navigator.serviceWorker.register("./sw.js", { updateViaCache: "none" });
          }).then(function (reg) {
            // Force immediate update check — bypasses 24-hour throttle
            reg.update();
          }).catch(function () {});
        });
      }
    </script>
  </body>
</html>
