      /* ── First paint ──
         The whole app is one inlined module script. It is deferred, so the
         browser is free to paint the body first — but the body was a single
         empty <div id="root">, so there was nothing to paint and the screen
         stayed blank until megabytes of JavaScript had parsed and React had
         mounted. Measured cold on a throttled mid-range Android: 2.1s on good
         4G, 5.3s on slow 4G, of white.

         These few hundred bytes are the fix. They are plain markup with no
         script behind them, so they appear in the first frame, and main.tsx
         fades them out once React has actually rendered. Nothing here is
         interactive on purpose: showing a piano that cannot be played yet
         would be a worse lie than showing that we are getting ready. */
      #boot {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 22px; background: #faf9f5; color: #1a1a1a;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        transition: opacity .28s ease;
      }
      #boot.gone { opacity: 0; pointer-events: none; }
      #boot .mark {
        font-size: 40px; font-weight: 700; letter-spacing: .22em;
        padding-left: .22em; /* balance the trailing letter-space */
      }
      #boot .say { font-size: 14px; opacity: .62; letter-spacing: .01em; }
      #boot .bar {
        width: 152px; height: 3px; border-radius: 3px; overflow: hidden;
        background: rgba(26,26,26,.1);
      }
      #boot .bar i {
        display: block; height: 100%; width: 40%; border-radius: 3px;
        background: #1a1a1a; animation: bootslide 1.15s ease-in-out infinite;
      }
      @keyframes bootslide {
        0%   { transform: translateX(-105%) }
        100% { transform: translateX(305%) }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .bar i { animation: none; width: 100%; opacity: .35 }
      }
      @media (prefers-color-scheme: dark) {
        html, body, #root, #boot { background: #14110f; }
        #boot { color: #f5f0ed; }
        #boot .bar { background: rgba(245,240,237,.14); }
        #boot .bar i { background: #f5f0ed; }
      }

    <!-- The app goes LAST, on purpose. vite-plugin-singlefile inlines this tag
         in place, so wherever it sits, megabytes of module source sit too, and
         the HTML parser has to read every byte of that text before it reaches

         <body> could not be reached, let alone painted, until the whole bundle
         had been parsed: first paint measured 2.4s on good 4G and 4.9s on slow
         4G, which is to say the boot screen was arriving too late to be a boot
         screen. Parsed last, the markup above paints first. -->
    <script>

        window.addEventListener("load", function () {
          // Unregister any stale SW registrations on a different script URL, then register fresh.
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            var kept = null;
            var kills = [];
            regs.forEach(function (r) {
              if (r.active && r.active.scriptURL && r.active.scriptURL.indexOf("sw.js") !== -1) {
                kept = r;
              } else {
                kills.push(r.unregister());
              }
            });
            return Promise.all(kills);
          }).then(function () {
            return navigator.serviceWorker.register("./sw.js", { updateViaCache: "none" });
          }).then(function (reg) {
            // Force immediate update check — bypasses 24-hour throttle
